# Motor1 -- A1, far-left
[stepper_x]
dir_pin: PE5
step_pin: PE6
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: !PF3

position_endstop: 130

position_min: -130
position_max: 130

homing_speed: 50
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 0

# Motor2 -- A2, near-right (same belt as A1; toggle "!" on dir_pin if it fights A1)
[stepper_x1]
dir_pin: PE1
step_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_x1]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 0

#######################################################################
### Belt B: stepper_y (B1, M3 far-right) + stepper_y1 (B2, M4 near-left)
#######################################################################

# Motor3 -- B1, far-right
[stepper_y]
dir_pin: PB7
step_pin: PB8
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
endstop_pin: !PF4

position_endstop: 170

position_min: -140
position_max: 170
homing_speed: 50

homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PB9
run_current: 0.800
stealthchop_threshold: 0

# Motor4 -- B2, near-left (same belt as B1; toggle "!" on dir_pin if it fights B1)
[stepper_y1]
dir_pin: PB3
step_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_y1]
uart_pin: PB5
run_current: 0.800
stealthchop_threshold: 0