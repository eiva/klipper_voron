[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True    ; Включаем кастомные координаты парковки
variable_custom_park_x    : 0.0     ; Центр стола по оси X
variable_custom_park_y    : 110.0   ; Замените 225.0 на ваш максимальный Y минус 10 мм
variable_custom_park_dz   : 10.0    ; Подъем по Z на паузе (мм)
variable_retract          : 2.0     ; Откат филамента при паузе (мм)
variable_cancel_retract   : 5.0     ; Откат при отмене печати (мм)
variable_speed_move       : 100.0   ; Скорость перемещения в парковку (мм/с)
variable_park_at_cancel   : True    ; Уезжать в парковку при отмене печати
variable_park_at_cancel_x : 0.0     ; X для отмены печати
variable_park_at_cancel_y : 130.0   ; Y для отмены печати (тоже ваш макс Y минус 10)
gcode:

[gcode_macro _PARK_TOOLHEAD_Z]
gcode:
    # Пробуем достать z_lift из _CLIENT_VARIABLE, иначе берем 10.0 мм
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set z_lift = client.custom_park_dz|default(10.0)|float %}

    # Безопасный расчет Z (чтобы не упереться в потолок)
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # Поднимаем по Z в относительных координатах (G91)
    G91
    {% if z_safe > 0 %}
        G1 Z{z_safe} F900
    {% endif %}


[gcode_macro _PARK_TOOLHEAD_E]
gcode:
    # Берем длину отката из _CLIENT_VARIABLE, иначе 2.0 мм
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set retract_len = client.retract|default(2.0)|float %}
    
    # Выполняем откат в относительных координатах (G91)
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{retract_len} F2100
    {% endif %}


[gcode_macro _PARK_TOOLHEAD_XY]
gcode:
    # Загружаем настройки из _CLIENT_VARIABLE
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    
    # Координата X (если не задана в _CLIENT_VARIABLE, берем 0.0)
    {% set x_park = client.custom_park_x|default(0.0)|float %}
    
    # Координата Y (если не задана, берем максимум по Y минус 10 мм)
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set y_park = client.custom_park_y|default(max_y - 10.0)|float %}
    
    # Скорость перемещения (если не задана, берем 100 мм/с -> F6000)
    {% set speed_move = client.speed_move|default(100.0)|float * 60 %}

    # Уезжаем в парковочную позицию в абсолютных координатах (G90)
    G90
    G1 X{x_park} Y{y_park} F{speed_move}


[gcode_macro _PARK_TOOLHEAD]
gcode:
    _PARK_TOOLHEAD_E
    _PARK_TOOLHEAD_Z
    _PARK_TOOLHEAD_XY