[include mainsail.cfg]
[include ebb.cfg]
[include eddy.cfg]
[include resonance.cfg]
[include z_tilt.cfg]
[include steppers_xy.cfg]
[include steppers_z.cfg]
[include homing.cfg]
[include bed_mesh.cfg]
[include print_macro.cfg]
[include pause_resume.cfg]
[include sfs.cfg]


[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[exclude_object]
[respond]

# Manta M8P v2 main MCU, USB-to-CAN bridge mode
[mcu]
canbus_uuid: 6769ef4a9045


# CB1 host MCU (SoC fan)
[mcu CB1]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 8000
max_z_velocity: 30
max_z_accel: 450
square_corner_velocity: 12

# SET_KINEMATIC_POSITION (BENCH_READY) and FORCE_MOVE (MOTOR_*) need this
[force_move]
enable_force_move: true

#######################################################################
### Board health
#######################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_fan SoC_fan]
pin: CB1:gpio79
kick_start_time: 0.8
off_below: 0.1
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 0
max_temp: 100
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.1
max_speed: 0.8
target_temp: 50

#######################################################################
### Heated bed
#######################################################################


[heater_bed]
heater_pin: PF5
sensor_pin: PB1
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 60.073
pid_Ki: 3.423
pid_Kd: 263.571
min_temp: 0
max_temp: 85
pwm_cycle_time: 0.02227

