[z_tilt]
# 1. Физические точки вращения (крепежа) стола к моторам Z
z_positions:
	-209, -123
    0, 221
    209, -123
	
# 2. Точки на столе, в которых датчик BTT Eddy будет делать замеры
points:
    60, -60
	-60, -60
    -60, 60
    60, 60

speed: 170              # Скорость перемещения между точками тестирования
horizontal_move_z: 10    # Высота подъема сопла перед замером (для Eddy 5мм — отлично)
retries: 3              # Количество попыток выравнивания
retry_tolerance: 0.05 # Максимально допустимая погрешность (в мм) между точками
