#######################################################################
### Main Printing Macros
#######################################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

    SET_DISPLAY_TEXT MSG="1. Preheating..."
    RESPOND MSG="1. Preheating..."
    M140 S{BED_TEMP}          ; Включаем нагрев стола (без ожидания)
    M104 S150                 ; Греем сопло до безопасных 150°C (пластик не течет, но сопло расширилось)

	RESPOND MSG="2. Homing"
    G90                       ; Абсолютные координаты
    G28                       ; Первичный хоминг всех осей

    SET_DISPLAY_TEXT MSG="Waiting for Bed..."
	RESPOND MSG="3. Waiting for bed temperature"
    M190 S{BED_TEMP}          ; ТЕПЕРЬ ЖДЕМ стол. Все калибровки ниже будут на горячую!

    SET_DISPLAY_TEXT MSG="Adjusting Tilt..."
	RESPOND MSG="4. Bed leveling..."
    Z_TILT_ADJUST             ; Выравниваем Z-боковины
	RESPOND MSG="5. Calibrate Z"
    G28 Z                     ; КРИТИЧНО: Перехомячиваем Z после выравнивания наклона!

    SET_DISPLAY_TEXT MSG="BedMesh Calibration..."
	RESPOND MSG="6. Bed mesh calibration"
    BED_MESH_CALIBRATE ADAPTIVE=1 ; Делаем адаптивную сетку под размер детали
    # Примечание: Современный Клиппер при ADAPTIVE=1 сам применяет сетку,
    # команда BED_MESH_PROFILE LOAD больше не нужна.

    SET_DISPLAY_TEXT MSG="Moving to start..."
	RESPOND MSG="7. Parking..."
    G1 Z50 F240               ; Приподнимаем голову
    G1 X-120 Y-130 F3000           ; Уводим в угол к началу прочисточной линии

    SET_DISPLAY_TEXT MSG="Final heating..."
	RESPOND MSG="8. Final heating"
    M109 S{EXTRUDER_TEMP}     ; Ждем финишную температуру сопла

    SET_DISPLAY_TEXT MSG="Cleaning nozzle..."
	RESPOND MSG="9. Cleaning nozzle..."
    M83                       ; Относительное экструдирование
    G1 Z0.28 F240
    G92 E0
    G1 Y-30 E10 F1500         ; Линия туда
    G1 X-118 F5000
    G92 E0
    G1 Y-130 E10 F1200          ; Линия обратно
    G92 E0
	G1 Z2 F240

	RESPOND MSG="10. Printing..."
    SET_DISPLAY_TEXT MSG="Printing!"

[gcode_macro END_PRINT]
gcode:
	SET_DISPLAY_TEXT MSG="Finishing..."
	M104 S0 ; Выключить нагрев экструдера
	M140 S0 ; Выключить нагрев стола
  
	_PARK_TOOLHEAD_E
	_PARK_TOOLHEAD_Z
	_PARK_TOOLHEAD_XY

	# 6. Охлаждение
	M107 ; Выключить вентилятор обдува детали

	# 7. Отключение моторов
	M84

	SET_DISPLAY_TEXT MSG="Print finished!"
