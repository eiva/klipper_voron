# printer.cfg -- Voron skeleton bench on BTT Manta M8P v2 (CB1), 2026-10-10
#
# Only the four AWD CoreXY motors (LDO 42STH48) are connected. Heaters,
# thermistors, probe and Z are removed on purpose: an open ADC reads garbage
# and shuts Klipper down. The full Ender 3 config is kept in the Notebook:
#   IT/3D Printer/M8P/backups/2026-10-09 printer.cfg
#
# Motor slots, viewed from the top, "far" = rear of the printer. Sequential
# slots M1..M4, so every pair sits diagonally across the gantry:
#   belt A (x+y):  far-left   = M1 -> [stepper_x]   (A1)
#                  near-right = M2 -> [stepper_x1]  (A2)
#   belt B (x-y):  far-right  = M3 -> [stepper_y]   (B1)
#                  near-left  = M4 -> [stepper_y1]  (B2)
#   dummy [stepper_z] on slot M5 (corexy refuses to start without a Z)
# Sequential slots also mean every motor has a STOP header (M1-M6 only), so
# sensorless homing stays possible later.

[include mainsail.cfg]
[include bench_tests.cfg]
[include ebb.cfg]
[include eddy.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

# Manta M8P v2 main MCU, USB-to-CAN bridge mode
[mcu]
canbus_uuid: 6769ef4a9045


# CB1 host MCU (SoC fan)
[mcu CB1]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 30
max_z_accel: 450
square_corner_velocity: 5

# SET_KINEMATIC_POSITION (BENCH_READY) and FORCE_MOVE (MOTOR_*) need this
[force_move]
enable_force_move: true

#######################################################################
### Board health
#######################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_fan SoC_fan]
pin: CB1:gpio79
kick_start_time: 0.8
off_below: 0.1
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 25
max_temp: 100
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.1
max_speed: 0.8
target_temp: 50

#######################################################################
### Belt A: stepper_x (A1, M1 far-left) + stepper_x1 (A2, M2 near-right)
#######################################################################
# No endstops on the skeleton. endstop_pin is a placeholder (the slot's STOP
# header) because Klipper demands one on the primary stepper of a rail. We
# never home; BENCH_READY declares the origin. Limits are +/-150 from that
# origin, so put the toolhead in the middle of the gantry first.
# homing_positive_dir must be explicit: Klipper infers it from where
# position_endstop sits relative to min/max, and 0 in the middle of -150..150
# is neither end ("Unable to infer homing_positive_dir").
#
# LDO 42STH48: 0.8 A is plenty for AWD (each motor carries half a belt).
# If the label says 2504AC (0.9 deg) add "full_steps_per_rotation: 400" to all
# four stepper sections -- MOTOR_A1 DIST=40 will show only half a turn.

# Motor1 -- A1, far-left
[stepper_x]
dir_pin: PE5
step_pin: PE6
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: !PF3

position_endstop: 130

position_min: -130
position_max: 130

homing_speed: 50
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 0

# Motor2 -- A2, near-right (same belt as A1; toggle "!" on dir_pin if it fights A1)
[stepper_x1]
dir_pin: PE1
step_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_x1]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 0

#######################################################################
### Belt B: stepper_y (B1, M3 far-right) + stepper_y1 (B2, M4 near-left)
#######################################################################

# Motor3 -- B1, far-right
[stepper_y]
dir_pin: PB7
step_pin: PB8
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
endstop_pin: !PF4

position_endstop: -170

position_min: -170
position_max: 140
homing_speed: 50

homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PB9
run_current: 0.800
stealthchop_threshold: 0

# Motor4 -- B2, near-left (same belt as B1; toggle "!" on dir_pin if it fights B1)
[stepper_y1]
dir_pin: PB3
step_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 40

[tmc2209 stepper_y1]
uart_pin: PB5
run_current: 0.800
stealthchop_threshold: 0

#######################################################################
### Z
#######################################################################

# Motor5 -- Z, left
[stepper_z]
dir_pin: !PG12
step_pin: PG13
enable_pin: !PG15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -1
homing_speed: 8
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG14
run_current: 0.650
stealthchop_threshold: 999999

# Motor6 -- Z, center
[stepper_z1]
dir_pin: !PD7
step_pin: PG9
enable_pin: !PG11
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: PG10
run_current: 0.650
stealthchop_threshold: 999999

# Motor7 -- Z, right
[stepper_z2]
dir_pin: !PD3
step_pin: PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z2]
uart_pin: PD5
run_current: 0.650
stealthchop_threshold: 999999

#######################################################################
### Homing Y -> X -> Z
#######################################################################


[homing_override]
axes: xyz
gcode:
    # Проверяем, вызывается ли полная парковка (просто G28 без указания конкретных осей)
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Если паркуем Y или всю систему целиком
    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}

    # Если паркуем X или всю систему целиком
    {% if home_all or 'X' in params %}
        # Если перед этим Y еще не был запаркован, паркуем его в экстренном порядке
        {% if 'y' not in printer.toolhead.homed_axes %}
            G28 Y
        {% endif %}
        
        # Смещаем Y в позицию второй кнопки
        G1 Y-100 F3000
        
        # Паркуем X
        G28 X
    {% endif %}

    # Если паркуем Z или всю систему целиком
    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}

#######################################################################
### Heated bed
#######################################################################


[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB
sensor_type: EPCOS 100K B57560G104F
control: watermark
control: pid
# tuned for stock hardware with 50 degree Celsius target
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -20.0
y_offset: -35.0
descend_z: 2.0

samples: 4                     # Количество замеров в точке хоминга (от 3 до 5)
samples_result: median         # Метод расчета: "median" (медиана) или "average" (среднее)
sample_retract_dist: 5.0       # На сколько мм поднимать сопло между замерами
samples_tolerance: 0.02        # Максимально допустимый разброс между замерами (в мм)
samples_tolerance_retries: 3   # Сколько раз переделывать замеры, если разброс больше tolerance

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

