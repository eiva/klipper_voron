[mcu eddy]
canbus_uuid: a1a0ceaf7e07

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0.0
y_offset: -30.0
descend_z: 2.0

samples: 3                     # Количество замеров в точке хоминга (от 3 до 5)
samples_result: median         # Метод расчета: "median" (медиана) или "average" (среднее)
sample_retract_dist: 5.0       # На сколько мм поднимать сопло между замерами
samples_tolerance: 0.02        # Максимально допустимый разброс между замерами (в мм)
samples_tolerance_retries: 3   # Сколько раз переделывать замеры, если разброс больше tolerance
