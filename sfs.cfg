[filament_switch_sensor switch_sensor]
switch_pin: ^PF0
pause_on_runout: False
runout_gcode:
	RESPOND TYPE=error MSG="SFS: switch sensor: no filament"
	PAUSE
insert_gcode:
	RESPOND MSG="SFS: switch sensor: filament inserted"

[filament_motion_sensor encoder_sensor]
switch_pin: ^PC15
detection_length: 10 # accuracy of motion sensor 2.88mm but we need few fronts to avoid false positives
extruder: extruder
pause_on_runout: False
runout_gcode:
	RESPOND TYPE=error MSG="SFS: encoder sensor: clog"
	PAUSE

insert_gcode:
	RESPOND MSG="SFS: encoder sensor: filament inserted"