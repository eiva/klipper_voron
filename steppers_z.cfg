# Motor5 -- Z, left
[stepper_z]
dir_pin: !PG12
step_pin: PG13
enable_pin: !PG15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 280
position_min: -5
homing_speed: 8
homing_retract_dist: 2
full_steps_per_rotation: 200

[tmc2209 stepper_z]
uart_pin: PG14
run_current: 0.550
stealthchop_threshold: 0

# Motor6 -- Z, center
[stepper_z1]
dir_pin: !PD7
step_pin: PG9
enable_pin: !PG11
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PG10
run_current: 0.550
stealthchop_threshold: 0

# Motor7 -- Z, right
[stepper_z2]
dir_pin: !PD3
step_pin: PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: PD5
run_current: 0.550
stealthchop_threshold: 0