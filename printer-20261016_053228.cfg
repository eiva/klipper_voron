# printer.cfg -- Voron skeleton bench on BTT Manta M8P v2 (CB1), 2026-10-10
#
# Only the four AWD CoreXY motors (LDO 42STH48) are connected. Heaters,
# thermistors, probe and Z are removed on purpose: an open ADC reads garbage
# and shuts Klipper down. The full Ender 3 config is kept in the Notebook:
#   IT/3D Printer/M8P/backups/2026-10-09 printer.cfg
#
# Motor slots, viewed from the top, "far" = rear of the printer. Sequential
# slots M1..M4, so every pair sits diagonally across the gantry:
#   belt A (x+y):  far-left   = M1 -> [stepper_x]   (A1)
#                  near-right = M2 -> [stepper_x1]  (A2)
#   belt B (x-y):  far-right  = M3 -> [stepper_y]   (B1)
#                  near-left  = M4 -> [stepper_y1]  (B2)
#   dummy [stepper_z] on slot M5 (corexy refuses to start without a Z)
# Sequential slots also mean every motor has a STOP header (M1-M6 only), so
# sensorless homing stays possible later.

[include mainsail.cfg]
[include bench_tests.cfg]
[include ebb.cfg]
[include eddy.cfg]
[include resonance.cfg]
[include z_tilt.cfg]
[include steppers_xy.cfg]
[include steppers_z.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

# Manta M8P v2 main MCU, USB-to-CAN bridge mode
[mcu]
canbus_uuid: 6769ef4a9045


# CB1 host MCU (SoC fan)
[mcu CB1]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 30
max_z_accel: 450
square_corner_velocity: 5

# SET_KINEMATIC_POSITION (BENCH_READY) and FORCE_MOVE (MOTOR_*) need this
[force_move]
enable_force_move: true

#######################################################################
### Board health
#######################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_fan SoC_fan]
pin: CB1:gpio79
kick_start_time: 0.8
off_below: 0.1
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 25
max_temp: 100
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.1
max_speed: 0.8
target_temp: 50

#######################################################################
### Belt A: stepper_x (A1, M1 far-left) + stepper_x1 (A2, M2 near-right)
#######################################################################
# No endstops on the skeleton. endstop_pin is a placeholder (the slot's STOP
# header) because Klipper demands one on the primary stepper of a rail. We
# never home; BENCH_READY declares the origin. Limits are +/-150 from that
# origin, so put the toolhead in the middle of the gantry first.
# homing_positive_dir must be explicit: Klipper infers it from where
# position_endstop sits relative to min/max, and 0 in the middle of -150..150
# is neither end ("Unable to infer homing_positive_dir").
#
# LDO 42STH48: 0.8 A is plenty for AWD (each motor carries half a belt).
# If the label says 2504AC (0.9 deg) add "full_steps_per_rotation: 400" to all
# four stepper sections -- MOTOR_A1 DIST=40 will show only half a turn.


#######################################################################
### Z
#######################################################################


#######################################################################
### Homing Y -> X -> Z
#######################################################################


[homing_override]
axes: xyz
gcode:
    # --------------------------------------------------------------------
    # 1. ОПРЕДЕЛЯЕМ, ЧТО ИМЕННО НУЖНО ПАРКОВАТЬ
    # --------------------------------------------------------------------
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x   = home_all or 'X' in params %}
    {% set home_y   = home_all or 'Y' in params %}
    {% set home_z   = home_all or 'Z' in params %}

    # Если требуется парковка X или Z, мы обязаны сначала иметь запаркованный Y
    {% set need_y = home_y or ((home_x or home_z) and 'y' not in printer.toolhead.homed_axes) %}
    # Если требуется парковка Z, мы обязаны иметь запаркованный X
    {% set need_x = home_x or (home_z and 'x' not in printer.toolhead.homed_axes) %}

    # --------------------------------------------------------------------
    # 2. БЕЗОПАСНАЯ ПОДГОТОВКА (Перед любыми перемещениями)
    # --------------------------------------------------------------------
    # Задаем фейковые координаты (0,0,0), чтобы Klipper разрешил короткие движения
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0

    G91             # Включаем относительные координаты
    G1 Z1 F600      # Опускаем стол Trident на 1 мм вниз
    G1 X-5 F3000   # Сдвигаем сопло влево на 5 мм, чтобы не зацепить флажок/кнопку X
    G90             # Возвращаемся в абсолютные координаты

    # --------------------------------------------------------------------
    # 3. ПОСЛЕДОВАТЕЛЬНАЯ ПАРКОВКА (Y -> X -> Z)
    # --------------------------------------------------------------------

    # --- ШАГ 1: Паркуем Y ---
    {% if need_y %}
        G28 Y
    {% endif %}

    # --- ШАГ 2: Паркуем X ---
    {% if need_x %}
        # Сдвигаем балку по Y в позицию напротив концевика X
        G1 Y-100 F3000
        
        G28 X
    {% endif %}

    # --- ШАГ 3: Паркуем Z ---
    {% if home_z %}
        # Едем в центр стола для безопасного срабатывания щупа/датчика Z
        G1 X0 Y0 F3000
        
        G28 Z
        
        # Небольшой отскок стола вниз после парковки Z
        G91
        G1 Z5 F600
        G90
    {% endif %}

#######################################################################
### Heated bed
#######################################################################


[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB
sensor_type: EPCOS 100K B57560G104F
control: watermark
control: pid
# tuned for stock hardware with 50 degree Celsius target
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -20.0
y_offset: -35.0
descend_z: 2.0

samples: 4                     # Количество замеров в точке хоминга (от 3 до 5)
samples_result: median         # Метод расчета: "median" (медиана) или "average" (среднее)
sample_retract_dist: 5.0       # На сколько мм поднимать сопло между замерами
samples_tolerance: 0.02        # Максимально допустимый разброс между замерами (в мм)
samples_tolerance_retries: 3   # Сколько раз переделывать замеры, если разброс больше tolerance

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

